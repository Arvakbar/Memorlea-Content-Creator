<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login – Memorléa</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png"/>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="auth.css"/>
</head>
<body class="auth-page">

<div class="login-card">
  <a href="index.html"><img src="assets/images/logo.png" alt="Memorléa" style="height:64px;margin:0 auto 0.5rem;display:block"/></a>
  <h1 class="login-title">Admin Panel</h1>
  <p class="login-sub">Masuk untuk mengelola booking Memorléa</p>

  <div class="auth-message" id="auth-message" role="status" aria-live="polite" hidden></div>

  <form id="login-form">
    <div class="form-group" style="text-align:left">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="admin@memorlea.com" autocomplete="username" maxlength="254" required/>
    </div>
    <div class="form-group" style="text-align:left">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required/>
    </div>
    <button type="submit" class="form-submit" id="login-btn">Masuk</button>
  </form>
  <p class="auth-links"><a href="forgot-password.html">Lupa Password?</a><br/>Belum punya akun? <a href="register.html">Register</a></p>

  <p style="margin-top:1.5rem;font-size:0.78rem;color:var(--mid)">
    <a href="index.html" style="color:var(--plum);font-weight:500">← Kembali ke Website</a>
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth-common.js"></script>
<script src="js/admin-login.js"></script>
</body>
</html>
