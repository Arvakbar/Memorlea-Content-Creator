<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="referrer" content="no-referrer"/>
  <title>Lupa Password – Memorléa</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png"/>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="auth.css"/>
</head>
<body class="auth-page" data-auth-page="forgot">
<main class="login-card">
  <a href="index.html"><img src="assets/images/logo.png" alt="Memorléa"/></a>
  <h1 class="login-title">Lupa Password</h1>
  <p class="login-sub">Masukkan email akun untuk meminta tautan pemulihan password.</p>
  <div id="auth-message" class="auth-message" role="status" aria-live="polite" hidden></div>
  <form id="forgot-form">
    <div class="form-group"><label for="email">Email</label><input type="email" id="email" autocomplete="email" maxlength="254" required/></div>
    <button type="submit" id="forgot-btn" class="form-submit">Kirim Tautan Pemulihan</button>
  </form>
  <p class="auth-links"><a href="admin-login.html">Kembali ke Login</a><br/>Belum punya akun? <a href="register.html">Register</a></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth-common.js"></script>
<script src="js/forgot-password.js"></script>
</body>
</html>
