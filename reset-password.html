<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="referrer" content="no-referrer"/>
  <title>Reset Password – Memorléa</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png"/>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="auth.css"/>
</head>
<body class="auth-page" data-auth-page="reset">
<main class="login-card">
  <a href="index.html"><img src="assets/images/logo.png" alt="Memorléa"/></a>
  <h1 class="login-title">Reset Password</h1>
  <p class="login-sub">Gunakan tautan pemulihan terbaru dari email. Selesaikan perubahan sebelum menutup atau memuat ulang halaman ini.</p>
  <div id="auth-message" class="auth-message" role="status" aria-live="polite">Memverifikasi tautan pemulihan...</div>
  <form id="reset-form">
    <fieldset id="reset-fields" disabled>
      <div class="form-group"><label for="password">Password Baru</label><input type="password" id="password" autocomplete="new-password" minlength="8" aria-describedby="password-hint" required/><p id="password-hint" class="auth-hint">Minimal 8 karakter.</p></div>
      <div class="form-group"><label for="confirm-password">Konfirmasi Password Baru</label><input type="password" id="confirm-password" autocomplete="new-password" minlength="8" required/></div>
      <button type="submit" id="reset-btn" class="form-submit">Simpan Password Baru</button>
    </fieldset>
  </form>
  <p class="auth-links"><a href="forgot-password.html">Minta Tautan Baru</a><br/><a href="admin-login.html">Kembali ke Login</a></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth-common.js"></script>
<script src="js/reset-password.js"></script>
</body>
</html>
